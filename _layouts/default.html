<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != 'Home' %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.tagline }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <h1 class="wordmark"><a href="{{ '/' | relative_url }}">{{ site.author.name }}</a></h1>
    <div class="spectrum" aria-hidden="true"></div>
    <p class="standfirst">{{ site.author.role }}, {{ site.author.affiliation }} · {{ site.author.location }}</p>
    {% include nav.html %}
  </div>
</header>

<main id="main" class="wrap">
  {{ content }}
</main>

<footer class="colophon">
  <div class="wrap">
    <p>{{ site.author.name }} · Last updated {{ site.time | date: "%B %Y" }}</p>
    <p class="fine">Built with Jekyll and hosted on GitHub Pages.</p>
  </div>
</footer>

</body>
</html>
